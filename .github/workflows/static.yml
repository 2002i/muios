name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate txt file list
        run: |
          python3 <<'PY'
          import os
          import json

          public_dir = "public"
          files = []

          if os.path.exists(public_dir):
              for root, dirs, filenames in os.walk(public_dir):
                  for filename in filenames:
                      if filename.lower().endswith(".txt"):
                          full_path = os.path.join(root, filename)
                          rel_path = os.path.relpath(full_path, public_dir)
                          rel_path = rel_path.replace("\\", "/")
                          files.append(rel_path)

          files.sort()

          with open(os.path.join(public_dir, "files.json"), "w", encoding="utf-8") as f:
              json.dump(files, f, ensure_ascii=False, indent=2)

          print("TXT files:", len(files))
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
